name: Create Student Branch

on:
  issues:
    types: [opened]

jobs:
  create-branch:
    # 이슈 제목에 '[미션 시작]' 이라는 단어가 포함될 때만 실행
    if: contains(github.event.issue.title, '[미션 시작]')
    runs-on: ubuntu-latest
    
    # 1단계에서 설정한 쓰기 권한을 명시적으로 한 번 더 선언해 줍니다.
    permissions:
      contents: write
      issues: write

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Git 사용자 설정
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 교육생 ID로 브랜치 생성 및 푸시
        run: |
          BRANCH_NAME="${{ github.event.issue.user.login }}"
          git checkout -b $BRANCH_NAME
          git push origin $BRANCH_NAME
