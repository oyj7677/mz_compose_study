name: PR Build Check & JANDI Noti

on:
  pull_request_target:
    types: [opened, synchronize]
    branches-ignore: [ "main" ] 
  pull_request_review:
    types: [submitted]

jobs:
  # 1. 안드로이드 빌드 검증
  build-check:
    if: github.event_name == 'pull_request_target' # 👈 타겟 이름 일치시킴
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }} # 👈 PR 작성자의 코드를 명확하게 가져옴
          
      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Gradle 권한 부여 및 빌드
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug testDebugUnitTest

  # 2. PR 생성 잔디 알림
  notify-pr:
    if: github.event_name == 'pull_request_target' && github.event.action == 'opened' # 👈 타겟 이름 일치시킴
    runs-on: ubuntu-latest
    steps:
      - name: PR 오픈 알림
        run: |
          curl -X POST -H "Accept: application/vnd.tosslab.jandi-v2+json" -H "Content-Type: application/json" --data '{
            "body": "🚀 [새로운 PR] ${{ github.actor }}님의 PR이 도착했습니다.",
            "connectColor": "#00BFFF",
            "connectInfo": [{
              "title": "${{ github.event.pull_request.title }}",
              "description": "${{ github.event.pull_request.html_url }}"
            }]
          }' "${{ secrets.JANDI_WEBHOOK_COMPOSE_STUDY }}" # 👈 따옴표 추가

  # 3. 리뷰 승인(Approve) 잔디 알림
  notify-review:
    if: github.event_name == 'pull_request_review' && github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: 리뷰 완료 알림
        run: |
          curl -X POST -H "Accept: application/vnd.tosslab.jandi-v2+json" -H "Content-Type: application/json" --data '{
            "body": "✅ [리뷰 승인] ${{ github.actor }}님이 코드를 승인했습니다.",
            "connectColor": "#00FF00",
            "connectInfo": [{
              "title": "승인된 PR 확인",
              "description": "${{ github.event.pull_request.html_url }}"
            }]
          }' "${{ secrets.JANDI_WEBHOOK_COMPOSE_STUDY }}" # 👈 따옴표 추가
